<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Kayıt Ol - ArkeoBla</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        .link {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Kayıt Ol</h2>
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <form th:action="@{/register}" method="post">
            <input type="text" name="firstName" placeholder="Adınız" required>
            <input type="text" name="lastName" placeholder="Soyadınız" required>
            <input type="date" name="birthDate" required title="Doğum Tarihiniz">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="email" name="email" placeholder="E-posta Adresi" required>
            <input type="password" name="password" placeholder="Şifre (Min 6 karakter, 1 Büyük Harf)" required
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}" title="En az 6 karakter ve 1 büyük harf içermelidir">
            <button type="submit">Kayıt Ol</button>
        </form>
        <div class="link">Zaten hesabın var mı? <a href="/login">Giriş Yap</a></div>
    </div>
</body>

</html>
