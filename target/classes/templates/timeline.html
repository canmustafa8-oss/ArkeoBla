<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ArkeoBla - Zaman Makinesi</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap"
        rel="stylesheet">

    <!-- Scroll Reveal Library -->
    <script src="https://unpkg.com/scrollreveal"></script>

    <style>
        body {
            background-color: #1a1a1a;
            color: #dcd6ce;
            font-family: 'Lora', serif;
        }

        /* Timeline Container */
        .timeline-container {
            max-width: 1000px;
            margin: 50px auto;
            position: relative;
            padding: 0 20px;
        }

        /* Dikey Çizgi */
        .timeline-container::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: #c5a059;
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
        }

        /* Kartlar */
        .timeline-event {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
            box-sizing: border-box;
        }

        .timeline-event.left {
            left: 0;
        }

        .timeline-event.right {
            left: 50%;
        }

        /* Era Badge (Dönem Etiketi) */
        .era-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }

        /* Dönem Renkleri */
        .era-paleo {
            background: #5d6d7e;
            color: white;
        }

        /* Taş/Buz */
        .era-neolithic {
            background: #27ae60;
            color: white;
        }

        /* Tarım/Yeşil */
        .era-bronze {
            background: #d35400;
            color: white;
        }

        /* Bakır/Tunç */
        .era-iron {
            background: #7f8c8d;
            color: white;
        }

        /* Demir/Gri */

        .content-box {
            padding: 20px;
            background: #2c241b;
            border-radius: 8px;
            position: relative;
            border: 1px solid #444;
            transition: 0.3s;
        }

        .content-box:hover {
            transform: scale(1.02);
            border-color: #c5a059;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.2);
        }

        .event-year {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: #c5a059;
            margin-bottom: 5px;
        }

        .event-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #e0d8cc;
        }

        .event-img {
            width: 100%;
            border-radius: 4px;
            margin-bottom: 10px;
            border: 1px solid #555;
        }

        .event-desc {
            font-size: 14px;
            color: #ccc;
            line-height: 1.6;
            white-space: pre-line;
            /* Satır başlarını koru */
        }

        /* Daire İşareti */
        .timeline-event::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            right: -10px;
            background-color: #1a1a1a;
            border: 4px solid #c5a059;
            top: 25px;
            border-radius: 50%;
            z-index: 1;
        }

        .timeline-event.right::after {
            left: -10px;
        }

        /* Mobil Uyumluluk */
        @media screen and (max-width: 600px) {
            .timeline-container::after {
                left: 31px;
            }

            .timeline-event {
                width: 100%;
                padding-left: 70px;
                padding-right: 25px;
            }

            .timeline-event.right {
                left: 0%;
            }

            .timeline-event.left::after,
            .timeline-event.right::after {
                left: 21px;
            }
        }
    </style>
</head>

<body>

    <header role="banner"
        style="background: rgba(0,0,0,0.8); padding: 15px; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100;">
        <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
            <a href="/" style="font-family:'Cinzel', serif; font-size:24px; color:#c5a059; text-decoration:none;">⏳
                ZAMAN MAKİNESİ</a>
            <a href="/" style="color:#ccc; text-decoration:none;">Ana Sayfaya Dön</a>
        </div>
    </header>

    <div class="timeline-container">

        <div th:each="event, iter : ${events}"
            th:class="'timeline-event ' + (${iter.index % 2 == 0} ? 'left' : 'right')" class="reveal">

            <div class="content-box">
                <!-- Dönem Badge Rengi Dinamik -->
                <span class="era-badge" th:classappend="${event.era.contains('Paleolitik')} ? 'era-paleo' : 
                                      (${event.era.contains('Neolitik')} ? 'era-neolithic' : 
                                      (${event.era.contains('Tunç')} ? 'era-bronze' : 'era-iron'))"
                    th:text="${event.era}">DÖNEM</span>

                <h2 class="event-year" th:text="${event.year}">YIL</h2>
                <img th:if="${event.imageUrl != ''}" th:src="${event.imageUrl}" class="event-img">
                <h3 class="event-title" th:text="${event.title}">BAŞLIK</h3>

                <!-- Özet -->
                <p class="event-desc" th:text="${event.summary}">Özet...</p>

                <!-- Detaylar (Gizli) -->
                <div class="event-details"
                    style="display: none; margin-top: 15px; border-top: 1px solid #444; padding-top: 10px;">
                    <div th:utext="${event.details}" style="font-size: 14px; color: #ccc; line-height: 1.6;">Detaylar
                    </div>
                </div>

                <!-- Buton -->
                <button onclick="toggleDetails(this)" class="read-more-btn">
                    📖 Devamını Oku
                </button>
            </div>
        </div>

    </div>

    <style>
        .read-more-btn {
            background: none;
            border: 1px solid #c5a059;
            color: #c5a059;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 12px;
            transition: 0.3s;
        }

        .read-more-btn:hover {
            background: #c5a059;
            color: #1a1a1a;
        }
    </style>

    <script>
        // Scroll Reveal Animasyonu
        ScrollReveal().reveal('.reveal', {
            interval: 200,
            distance: '50px',
            origin: 'bottom',
            duration: 800,
            reset: false
        });

        // Detay Aç/Kapa
        function toggleDetails(btn) {
            const detailsDiv = btn.previousElementSibling; // .event-details
            if (detailsDiv.style.display === "none") {
                detailsDiv.style.display = "block";
                btn.innerText = "🔼 Kapat";
            } else {
                detailsDiv.style.display = "none";
                btn.innerText = "📖 Devamını Oku";
            }
        }
    </script>

</body>

</html>
