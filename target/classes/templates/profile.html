<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Profilim - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Cinzel', serif;
            background-color: #f0f2f5;
            color: #333;
        }

        .profile-container {
            max-width: 900px;
            margin: 50px auto;
            display: flex;
            gap: 20px;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            flex: 1;
        }

        .stats-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #c5a059;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .info-item {
            margin-bottom: 15px;
            font-size: 16px;
        }

        .info-label {
            font-weight: bold;
            color: #555;
            display: block;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .badge-list {
            margin-top: 10px;
        }

        .badge {
            display: inline-block;
            background: #c5a059;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            margin-right: 5px;
            font-size: 12px;
        }

        canvas {
            max-width: 300px;
            max-height: 300px;
        }
    </style>
</head>

<body>

    <div class="profile-container">

        <!-- Sol: Kullanıcı Bilgileri -->
        <div class="profile-card">
            <h2>👤 Arkeolog Karnesi</h2>

            <div class="info-item">
                <span class="info-label">KULLANICI ADI</span>
                <span th:text="${user.username}">admin</span>
            </div>

            <div class="info-item">
                <span class="info-label">ROL</span>
                <span th:text="${user.role}">AKADEMISYEN</span>
            </div>

            <div class="info-item">
                <span class="info-label">TOPLAM PUAN</span>
                <span th:text="${user.totalScore}"
                    style="font-size: 24px; color: #2ecc71; font-weight: bold;">1250</span>
            </div>

            <div class="info-item">
                <span class="info-label">KAZANILAN ROZETLER</span>
                <div class="badge-list">
                    <span th:if="${user.badges != null}" th:each="badge : ${user.badges.split(',')}" class="badge"
                        th:text="${badge}">BİLGE_KAŞİF</span>
                    <span th:if="${user.badges == null or user.badges == ''}"
                        style="color: #999; font-size: 14px;">Henüz rozet yok.</span>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <a href="/" style="text-decoration: none; color: #c5a059; font-weight: bold;">← Ana Sayfaya Dön</a>
            </div>
        </div>

        <!-- Sağ: Grafikler -->
        <div class="stats-card">
            <h2>📊 Performans Grafiği</h2>
            <canvas id="statsChart"></canvas>
            <p style="margin-top: 20px; font-size: 14px; color: #666;"
                th:text="'Toplam ' + ${totalAttempts} + ' soru cevapladınız.'">Toplam 50 soru</p>
        </div>

    </div>

    <script th:inline="javascript">
        /* Thymeleaf verilerini JS değişkenlerine aktar */
        var correct = [[${ user.correctAnswers }]];
        var wrong = [[${ user.wrongAnswers }]];

        // Chart.js Konfigürasyonu
        const ctx = document.getElementById('statsChart').getContext('2d');
        const statsChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Doğru', 'Yanlış'],
                datasets: [{
                    label: 'Soru Analizi',
                    data: [correct, wrong],
                    backgroundColor: [
                        '#2ecc71', // Yeşil (Doğru)
                        '#e74c3c'  // Kırmızı (Yanlış)
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                    }
                }
            }
        });
    </script>

</body>

</html>
