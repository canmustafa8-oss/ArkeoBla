<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ArkeoBla - Keşif Haritası</title>
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <style>
        /* ... Existing Styles ... */
        .leaflet-popup-content-wrapper {
            background: #f4f1ea;
            border: 2px solid #2c241b;
            border-radius: 4px;
            font-family: 'Lora', serif;
            max-width: 320px;
            /* Genişlik artırıldı */
        }

        .leaflet-popup-content {
            max-height: 250px;
            /* Yükseklik sınırı */
            overflow-y: auto;
            /* Scroll bar */
            padding-right: 5px;
            /* Scroll için boşluk */
        }

        .leaflet-popup-content b {
            font-family: 'Cinzel', serif;
            color: #8b3a3a;
            font-size: 18px;
            /* Başlık büyütüldü */
            display: block;
            margin-bottom: 8px;
            border-bottom: 2px solid #c5a059;
            padding-bottom: 5px;
        }

        /* Marker Cluster Stilleri */
        .marker-cluster-small {
            background-color: rgba(181, 226, 140, 0.6);
        }

        .marker-cluster-small div {
            background-color: rgba(110, 204, 57, 0.6);
        }

        .marker-cluster-medium {
            background-color: rgba(241, 128, 23, 0.6);
        }

        .marker-cluster-medium div {
            background-color: rgba(240, 194, 12, 0.6);
        }

        .marker-cluster-large {
            background-color: rgba(253, 156, 115, 0.6);
        }

        .marker-cluster-large div {
            background-color: rgba(241, 128, 23, 0.6);
        }

        .marker-cluster {
            background-clip: padding-box;
            border-radius: 20px;
        }

        .marker-cluster div {
            width: 30px;
            height: 30px;
            margin-left: 5px;
            margin-top: 5px;
            text-align: center;
            border-radius: 15px;
            font: 12px "Helvetica Neue", Arial, Helvetica, sans-serif;
            font-weight: bold;
            color: #fff;
            line-height: 30px;
        }
    </style>
</head>

<body>

    <a href="/" class="back-btn">← Geri Dön</a>

    <div class="map-header">
        <h1>Dünya Keşif Haritası</h1>
        <div style="font-size: 12px; color: #eee; margin-top: 5px;">500+ Keşif Noktası</div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        // Haritayı başlat
        var map = L.map('map').setView([39.92, 32.85], 5); // Zoom seviyesi 5 yapıldı

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Marker Cluster Grubu Oluştur
        var markers = L.markerClusterGroup();

        fetch('/api/locations')
            .then(response => response.json())
            .then(locations => {
                locations.forEach(loc => {
                    var popupContent = `<b>${loc.name}</b><img src="${loc.imageUrl}"><br>${loc.description.replace(/\n/g, '<br>')}`;

                    var marker = L.marker([loc.latitude, loc.longitude])
                        .bindPopup(popupContent);

                    markers.addLayer(marker); // Marker'ı kümeye ekle
                });

                map.addLayer(markers); // Kümeyi haritaya ekle

                // Haritayı tüm noktalara sığdır (Opsiyonel)
                // var group = new L.featureGroup(locations.map(l => L.marker([l.latitude, l.longitude])));
                // map.fitBounds(group.getBounds());
            })
            .catch(error => console.error('Hata:', error));
    </script>
</body>

</html>
