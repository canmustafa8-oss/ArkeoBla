<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Canlı Toplantı - ArkeoBla</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #1f1f1f;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-badge {
            background: #d32f2f;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .main-stage {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: auto;
        }

        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid #333;
        }

        .controls-bar {
            background: #1f1f1f;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid #333;
        }

        .btn-control {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #333;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-control:hover {
            background: #444;
        }

        .btn-danger {
            background: #d32f2f;
        }

        .btn-danger:hover {
            background: #b71c1c;
        }

        .join-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #2c2c2c;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <!-- Join Modal -->
    <div id="join-modal" class="join-modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Toplantıya Katıl</h3>
            <p style="font-size:12px; color:#aaa;">ID'niz: <span id="my-peer-id" style="color:#4ea8de">...</span></p>
            <input type="text" id="remote-peer-id" placeholder="Bağlanılacak ID'yi yapıştırın">
            <button onclick="connectToPeer()" class="btn-control"
                style="width:100%; border-radius:6px; background:#28a745;">BAĞLAN</button>
            <button onclick="closeModal()" class="btn-control"
                style="width:100%; border-radius:6px; background:#333; margin-top:10px;">İPTAL (Sadece İzle)</button>
        </div>
    </div>

    <div class="header">
        <h2><span>🎥</span> ArkeoBla Meeting <span class="live-badge">CANLI</span></h2>
        <div style="font-size: 14px; color: #aaa;">Güvenli Bağlantı</div>
    </div>

    <div class="main-stage">
        <div id="video-grid">
            <!-- Videos will appear here -->
        </div>
    </div>

    <div class="controls-bar">
        <button onclick="toggleAudio()" class="btn-control">🎤</button>
        <button onclick="toggleVideo()" class="btn-control">📷</button>
        <button onclick="location.href='/'" class="btn-control btn-danger">📞</button>
    </div>

    <script>
        const peer = new Peer();
        let myStream;
        const videoGrid = document.getElementById('video-grid');
        const myVideo = document.createElement('video');
        myVideo.muted = true;

        navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        }).then(stream => {
            myStream = stream;
            addVideoStream(myVideo, stream);

            peer.on('call', call => {
                call.answer(stream);
                const video = document.createElement('video');
                call.on('stream', userVideoStream => {
                    addVideoStream(video, userVideoStream);
                });
            });
        }).catch(err => {
            console.error("Kamera hatası:", err);
        });

        peer.on('open', id => {
            document.getElementById('my-peer-id').innerText = id;
            console.log('ID:', id);
        });

        function connectToPeer() {
            const remoteId = document.getElementById('remote-peer-id').value;
            if (!remoteId) return alert("ID giriniz");

            const call = peer.call(remoteId, myStream);
            const video = document.createElement('video');
            call.on('stream', userVideoStream => {
                addVideoStream(video, userVideoStream);
            });
            call.on('close', () => video.remove());
            closeModal();
        }

        function addVideoStream(video, stream) {
            video.srcObject = stream;
            video.addEventListener('loadedmetadata', () => {
                video.play();
            });
            videoGrid.append(video);
        }

        function closeModal() {
            document.getElementById('join-modal').style.display = 'none';
        }

        let audioEnabled = true;
        let videoEnabled = true;

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            myStream.getAudioTracks()[0].enabled = audioEnabled;
            alert(audioEnabled ? "Mikrofon Açık" : "Mikrofon Kapalı");
        }

        function toggleVideo() {
            videoEnabled = !videoEnabled;
            myStream.getVideoTracks()[0].enabled = videoEnabled;
            alert(videoEnabled ? "Kamera Açık" : "Kamera Kapalı");
        }
    </script>
</body>

</html>
