<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ArkeoBla - Fotoğraf Yarışması</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #dcd6ce;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Hero Section - Winner */
        .hero-winner {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('/images/hero-bg.jpg');
            /* Fallback */
            border: 2px solid #c5a059;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .hero-winner h2 {
            font-family: 'Cinzel', serif;
            color: #c5a059;
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px black;
        }

        .winner-img-container {
            max-width: 600px;
            margin: 0 auto;
            border: 4px solid #c5a059;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
        }

        .winner-img-container img {
            width: 100%;
            display: block;
        }

        /* Upload Section */
        .upload-bar {
            background: #2c241b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #c5a059;
        }

        .upload-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .upload-form input[type="file"] {
            color: #ccc;
        }

        /* Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .photo-card {
            background: #2c241b;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.3s;
            border: 1px solid #444;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            border-color: #c5a059;
        }

        .photo-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            cursor: pointer;
        }

        .photo-info {
            padding: 15px;
        }

        .photo-meta {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .like-btn {
            background: none;
            border: 1px solid #555;
            color: #c5a059;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .like-btn:hover {
            background: #c5a059;
            color: #1a1a1a;
        }

        .alert {
            padding: 15px;
            background: #4caf50;
            color: white;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <header role="banner" style="background: rgba(0,0,0,0.8); padding: 15px; border-bottom: 1px solid #333;">
        <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
            <a href="/" style="font-family:'Cinzel', serif; font-size:24px; color:#c5a059; text-decoration:none;">📸
                ARKEOBLA YARIŞMA</a>
            <a href="/" style="color:#ccc; text-decoration:none;">Ana Sayfaya Dön</a>
        </div>
    </header>

    <div class="gallery-container">

        <div th:if="${message}" class="alert" th:text="${message}"></div>

        <!-- AYIN FOTOĞRAFI (KAZANAN) -->
        <div class="hero-winner" th:if="${winner != null}">
            <h2>🏆 Ayın Fotoğrafı</h2>
            <div class="winner-img-container">
                <img th:src="${winner.url}" alt="Winner">
            </div>
            <div style="margin-top:20px;">
                <h3 th:text="${winner.username}" style="color:white;">Kullanıcı</h3>
                <p th:text="${winner.description}" style="font-style:italic; color:#ccc;"></p>
                <div style="font-size:20px; color:#c5a059; margin-top:10px;">
                    ❤️ <span th:text="${winner.likeCount}">0</span> Beğeni
                </div>
            </div>
        </div>

        <div class="hero-winner" th:if="${winner == null}" style="padding:20px;">
            <h2>🏆 Ayın Fotoğrafı</h2>
            <p>Henüz bir kazanan yok. İlk fotoğrafı sen yükle ve lider ol!</p>
        </div>

        <!-- UPLOAD BAR -->
        <div class="upload-bar">
            <div>
                <h3>Bir Tarih Paylaş</h3>
                <p style="font-size:12px; color:#999;">Kendi çektiğin tarihi/antik fotoğrafları yükle.</p>
            </div>
            <form method="POST" action="/photos/upload" enctype="multipart/form-data" class="upload-form">
                <input type="text" name="description" placeholder="Açıklama (örn: Efes Kütüphanesi)" required
                    style="padding:8px; border-radius:4px; border:none;">
                <input type="file" name="file" accept="image/*" required>
                <button type="submit"
                    style="background:#c5a059; border:none; padding:8px 20px; color:black; font-weight:bold; cursor:pointer; border-radius:4px;">YÜKLE</button>
            </form>
        </div>

        <!-- GALLERY GRID -->
        <div class="photo-grid">
            <div th:each="photo : ${photos}" class="photo-card">
                <!-- Tıklayınca tam boy açılabilir (modal vs) ama şimdilik basit tutuyoruz -->
                <img th:src="${photo.url}" class="photo-img">
                <div class="photo-info">
                    <p th:text="${photo.description}" style="font-weight:bold; margin-bottom:5px;">Açıklama</p>
                    <div class="photo-meta">
                        <span th:text="${photo.username}">Kullanıcı</span>
                        <span th:text="${#temporals.format(photo.uploadedAt, 'dd MMM yyyy')}">Tarih</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                        <button class="like-btn" th:onclick="'likePhoto(' + ${photo.id} + ', this)'">
                            ❤️ <span class="count" th:text="${photo.likeCount}">0</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function likePhoto(id, btn) {
            fetch('/photos/' + id + '/like', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        const countSpan = btn.querySelector('.count');
                        let count = parseInt(countSpan.innerText);
                        countSpan.innerText = count + 1;
                        btn.style.background = '#c5a059';
                        btn.style.color = '#1a1a1a';
                        btn.disabled = true; // Basit engelleme
                    }
                });
        }
    </script>
</body>

</html>
