<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>İçerik Ekle - ArkeoBla</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            height: 200px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            color: #555;
            text-decoration: none;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <div style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; color: #2c241b; font-family: 'Cinzel', serif; margin-bottom: 30px;">Yeni İçerik
            Oluştur</h2>

        <form th:action="@{/add-content}" method="post">
            <div class="form-group">
                <label>Başlık</label>
                <input type="text" name="title" required placeholder="İlgi çekici bir başlık girin...">
            </div>

            <div class="form-group row" style="display: flex; gap: 20px;">
                <div style="flex: 1;">
                    <label>Kategori</label>
                    <select name="category">
                        <option value="Arkeoloji">Arkeoloji</option>
                        <option value="Sanat">Sanat Tarihi</option>
                        <option value="Tarih" selected>Genel Tarih</option>
                        <option value="Antropoloji">Antropoloji</option>
                        <option value="Mitoloji">Mitoloji</option>
                        <option value="Diğer">Diğer</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Kapak Resmi URL</label>
                    <input type="text" name="imageUrl" placeholder="https://ornek.com/resim.jpg">
                </div>
            </div>

            <div class="form-group">
                <label>Kısa Özet (Giriş Metni)</label>
                <input type="text" name="summary" required
                    placeholder="Okuyucuyu çekecek kısa bir özet (Max 200 karakter)..." maxlength="255">
            </div>

            <div class="form-group">
                <label>İçerik Detayı</label>
                <textarea name="body" required placeholder="Hikayeni anlatmaya başla..."></textarea>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px;">
                <a href="/" style="color: #666;">İptal</a>
                <button type="submit" style="background: #28a745; padding: 12px 40px; font-size: 16px;">YAYINLA</button>
            </div>
        </form>
    </div>
</body>

</html>
