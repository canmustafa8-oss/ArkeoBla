<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>İçerik Ekle - ArkeoBla</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            height: 200px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            color: #555;
            text-decoration: none;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <h2>Yeni İçerik Ekle</h2>
    <form th:action="@{/add-content}" method="post">
        <div class="form-group">
            <label>Başlık</label>
            <input type="text" name="title" required>
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select name="category">
                <option value="Arkeoloji">Arkeoloji</option>
                <option value="Sanat">Sanat</option>
                <option value="Tarih">Tarih</option>
                <option value="Antropoloji">Antropoloji</option>
                <option value="Diğer">Diğer</option>
            </select>
        </div>

        <div class="form-group">
            <label>İçerik</label>
            <textarea name="body" required></textarea>
        </div>

        <button type="submit">Yayınla</button>
        <a href="/">İptal</a>
    </form>
</body>

</html>
