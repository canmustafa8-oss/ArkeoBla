<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Genel Sohbet - ArkeoBla</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f6f9;
        }

        #chat-page {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #messageArea {
            list-style: none;
            padding: 0;
            height: 400px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        #messageArea li {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        #messageArea li:nth-child(odd) {
            background: #fafafa;
        }

        .event-message {
            color: #888;
            text-align: center;
            font-style: italic;
        }

        .chat-message i {
            font-weight: bold;
            color: #007bff;
        }

        form {
            display: flex;
        }

        input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="chat-page">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>💬 Global ArkeoBla Sohbet</h2>
            <a href="/" style="text-decoration: none; color: #555;">← Çıkış</a>
        </div>

        <ul id="messageArea"></ul>

        <form id="messageForm" name="messageForm">
            <input type="text" id="message" placeholder="Mesaj yaz..." autocomplete="off" />
            <button type="submit">Gönder</button>
        </form>

        <!-- Kullanıcı adını gizli olarak alıyoruz -->
        <input type="hidden" id="username" th:value="${#authentication.name}" />
    </div>

    <script>
        var stompClient = null;
        var username = document.querySelector('#username').value;

        function connect() {
            var socket = new SockJS('/ws-chat');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, onConnected, onError);
        }

        function onConnected() {
            stompClient.subscribe('/topic/public', onMessageReceived);
            stompClient.send("/app/chat.addUser", {}, JSON.stringify({ sender: username, type: 'JOIN' }));
        }

        function onError(error) {
            console.log("WebSocket Bağlantı Hatası");
        }

        function sendMessage(event) {
            var messageContent = document.querySelector('#message').value.trim();
            if (messageContent && stompClient) {
                var chatMessage = {
                    sender: username,
                    content: messageContent,
                    type: 'CHAT'
                };
                stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
                document.querySelector('#message').value = '';
            }
            event.preventDefault();
        }

        function onMessageReceived(payload) {
            var message = JSON.parse(payload.body);
            var messageElement = document.createElement('li');

            if (message.type === 'JOIN') {
                messageElement.classList.add('event-message');
                message.content = message.sender + ' sohbete katıldı!';
                messageElement.innerText = message.content;
            } else if (message.type === 'LEAVE') {
                messageElement.classList.add('event-message');
                message.content = message.sender + ' ayrıldı.';
                messageElement.innerText = message.content;
            } else {
                messageElement.classList.add('chat-message');
                messageElement.innerHTML = '<i>' + message.sender + ':</i> ' + message.content;
            }

            var messageArea = document.querySelector('#messageArea');
            messageArea.appendChild(messageElement);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        document.querySelector('#messageForm').addEventListener('submit', sendMessage, true);
        connect();
    </script>
</body>

</html>
