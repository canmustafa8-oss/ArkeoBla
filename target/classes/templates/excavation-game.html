<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="'Kazı: ' + ${regionName}">Kazı Simülatörü - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Cinzel', serif;
            background-color: #2c241b;
            color: #dcd6ce;
            text-align: center;
            overflow: hidden;
            user-select: none;
        }

        .header-area {
            margin-top: 20px;
        }

        h1 {
            color: #f1c40f;
            text-shadow: 2px 2px 0 #000;
            margin: 0;
            font-size: 2.5em;
        }

        .sub-text {
            font-family: 'Lora', serif;
            color: #aaa;
            font-style: italic;
        }

        .region-badge {
            background: #c5a059;
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8em;
            vertical-align: middle;
            margin-left: 10px;
        }

        .game-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin-top: 30px;
        }

        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #5d4037;
        }

        .tool-btn {
            background: #3e2723;
            border: 2px solid #5d4037;
            color: #dcd6ce;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
        }

        .tool-btn:hover {
            background: #4e342e;
            transform: scale(1.05);
        }

        .tool-btn.active {
            border-color: #f1c40f;
            background: #5d4037;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }

        .tool-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .tool-name {
            font-size: 12px;
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 8px solid #5d4037;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            background: #000;
            cursor: none;
        }

        /* İmleçler */
        .cursor-brush {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23f1c40f" d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"/></svg>'), auto;
        }

        .artifact-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        #dirt-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        #custom-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: none;
        }

        .progress-container {
            width: 640px;
            margin: 0 auto;
            margin-top: 10px;
            background: #222;
            border-radius: 10px;
            height: 20px;
            border: 1px solid #444;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #d35400, #f1c40f);
            width: 0%;
            transition: width 0.2s;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            font-size: 12px;
            line-height: 20px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        #result-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 25, 20, 0.95);
            padding: 40px;
            border: 3px solid #c5a059;
            border-radius: 15px;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(197, 160, 89, 0.4);
            text-align: center;
            min-width: 400px;
        }

        .btn {
            background: #c5a059;
            color: #1a1a1a;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
            margin-right: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #d4af37;
            transform: translateY(-2px);
        }

        .btn.secondary {
            background: #555;
            color: #fff;
        }

        .btn.secondary:hover {
            background: #666;
        }
    </style>
</head>

<body>

    <div class="header-area">
        <h1>
            ⛏️ KAZI SİMÜLATÖRÜ
            <span class="region-badge" th:text="${regionName}">Bölge</span>
        </h1>
        <p class="sub-text">Seçilen bölgedeki tarihi eserleri gün yüzüne çıkarın.</p>
    </div>

    <div class="game-wrapper">
        <div class="toolbar">
            <div class="tool-btn active" onclick="selectTool('shovel')">
                <div class="tool-icon">⛏️</div>
                <div class="tool-name">Kaba Kazı</div>
            </div>
            <div class="tool-btn" onclick="selectTool('brush')">
                <div class="tool-icon">🧹</div>
                <div class="tool-name">İnce Fırça</div>
            </div>
        </div>

        <div>
            <div class="canvas-container" id="canvas-container">
                <div class="artifact-layer" th:style="'background-image: url(\'' + ${artifact.imageUrl} + '\');'"></div>
                <canvas id="dirt-canvas" width="640" height="480"></canvas>
                <div id="custom-cursor"></div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
                <div class="progress-text" id="progress-text">Kazı Durumu: %0</div>
            </div>
        </div>
    </div>

    <div id="result-modal">
        <h2 style="color: #2ecc71; font-size: 2em; margin-bottom: 10px;">🎉 ESER BULUNDU!</h2>
        <div
            style="background: #000; padding: 10px; display: inline-block; border-radius: 8px; border: 1px solid #444;">
            <img th:src="${artifact.imageUrl}" style="max-height: 200px; max-width: 100%; border-radius: 4px;">
        </div>
        <h3 th:text="${artifact.name}" style="color: #f1c40f; margin: 15px 0 5px;">Eser Adı</h3>
        <p th:text="${artifact.description}" style="color: #ccc; font-style: italic;">Açıklama</p>

        <br>
        <!-- Aynı bölgede yeni kazı -->
        <a th:href="'/excavation/play?region=' + ${regionCode}" class="btn">🔄 Bu Bölgede Devam Et</a>
        <!-- Bölge seçimine dön -->
        <a href="/excavation" class="btn secondary">🌍 Bölge Değiştir</a>
    </div>

    <script th:inline="javascript">
        const canvas = document.getElementById('dirt-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const cursor = document.getElementById('custom-cursor');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        let isDrawing = false;
        let isFinished = false;

        let currentTool = 'shovel';
        const tools = {
            shovel: { size: 40, cursorSize: 80 },
            brush: { size: 15, cursorSize: 30 }
        };

        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            updateCursorStyle();
        }

        updateCursorStyle();

        function updateCursorStyle() {
            const size = tools[currentTool].cursorSize;
            cursor.style.width = size + 'px';
            cursor.style.height = size + 'px';
            cursor.style.display = 'block';
        }

        function fillDirt() {
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 8000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 4;
                ctx.fillStyle = Math.random() > 0.5 ? '#3e2723' : '#795548';
                ctx.fillRect(x, y, size, size);
            }
        }
        fillDirt();

        ctx.globalCompositeOperation = 'destination-out';

        function dig(e) {
            if (!isDrawing || isFinished) return;

            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            cursor.style.left = clientX + 'px';
            cursor.style.top = clientY + 'px';

            const toolSize = tools[currentTool].size;

            ctx.beginPath();
            ctx.arc(x, y, toolSize, 0, Math.PI * 2);
            ctx.fill();

            if (Math.random() > 0.5) checkProgress();
        }

        container.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        container.addEventListener('mousemove', (e) => {
            const clientX = e.clientX;
            const clientY = e.clientY;
            cursor.style.left = clientX + 'px';
            cursor.style.top = clientY + 'px';

            if (isDrawing) dig(e);
        });

        container.addEventListener('mouseenter', () => cursor.style.display = 'block');
        container.addEventListener('mouseleave', () => {
            cursor.style.display = 'none';
            isDrawing = false;
        });

        container.addEventListener('touchstart', (e) => { isDrawing = true; e.preventDefault(); dig(e); });
        window.addEventListener('touchend', () => isDrawing = false);
        container.addEventListener('touchmove', (e) => { e.preventDefault(); dig(e); });

        function checkProgress() {
            if (!this.checkCounter) this.checkCounter = 0;
            this.checkCounter++;

            if (this.checkCounter % 10 === 0) {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height, { willReadFrequently: true }).data;
                let transparentPixels = 0;
                const step = 200;

                for (let i = 3; i < imageData.length; i += 4 * step) {
                    if (imageData[i] === 0) transparentPixels++;
                }

                const totalSampled = imageData.length / (4 * step);
                const percent = Math.floor((transparentPixels / totalSampled) * 100);

                progressBar.style.width = percent + '%';
                progressText.innerText = 'Kazı Durumu: %' + percent;

                if (percent >= 70) {
                    finishGame();
                }
            }
        }

        function finishGame() {
            isFinished = true;
            canvas.style.opacity = '0';
            canvas.style.transition = 'opacity 1s';
            confetti({ particleCount: 200, spread: 120, origin: { y: 0.6 } });

            setTimeout(() => {
                document.getElementById('result-modal').style.display = 'block';
            }, 800);
        }
    </script>

</body>

</html>
