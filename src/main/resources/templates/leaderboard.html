<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Liderlik Tablosu - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cinzel', serif;
            background-color: #fcefe3;
            color: #333;
        }

        .leaderboard-container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid #c5a059;
        }

        h2 {
            text-align: center;
            color: #c5a059;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f9f9f9;
            color: #555;
            font-weight: bold;
        }

        tr:hover {
            background: #fdfdfd;
        }

        .rank {
            font-weight: bold;
            color: #c5a059;
            font-size: 1.2em;
        }

        .rank-1 {
            color: #d4af37;
            font-size: 1.5em;
        }

        /* Altın */
        .rank-2 {
            color: #c0c0c0;
            font-size: 1.4em;
        }

        /* Gümüş */
        .rank-3 {
            color: #cd7f32;
            font-size: 1.3em;
        }

        /* Bronz */
        .badge-icon {
            display: inline-block;
            background: #c5a059;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 5px;
        }
    </style>
</head>

<body>

    <div class="leaderboard-container">
        <h2>🏆 LİDERLİK TABLOSU</h2>

        <table>
            <thead>
                <tr>
                    <th>Sıra</th>
                    <th>Arkeolog (Kullanıcı)</th>
                    <th>Puan</th>
                    <th>Rozetler</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user, iter : ${topUsers}">
                    <td class="rank" th:classappend="'rank-' + (${iter.index} + 1)" th:text="${iter.index + 1}">1</td>
                    <td th:text="${user.username}" style="font-weight: bold;">Kullanıcı Adı</td>
                    <td th:text="${user.totalScore}">0</td>
                    <td>
                        <span th:if="${user.badges != null}" th:each="badge : ${user.badges.split(',')}"
                            class="badge-icon" th:text="${badge}">ROZET</span>
                        <span th:if="${user.badges == null or user.badges == ''}">-</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/" style="text-decoration: none; color: #c5a059; font-weight: bold;">🏠 Ana Sayfaya Dön</a>
        </div>
    </div>

</body>

</html>
