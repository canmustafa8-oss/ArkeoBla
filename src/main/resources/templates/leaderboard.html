<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Liderlik Tablosu - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cinzel', serif;
            background-color: #fcefe3;
            color: #333;
        }

        .leaderboard-container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid #c5a059;
        }

        h2 {
            text-align: center;
            color: #c5a059;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f9f9f9;
            color: #555;
            font-weight: bold;
        }

        tr:hover {
            background: #fdfdfd;
        }

        .rank {
            font-weight: bold;
            color: #c5a059;
            font-size: 1.2em;
        }

        .rank-1 {
            color: #d4af37;
            font-size: 1.5em;
        }

        /* Altın */
        .rank-2 {
            color: #c0c0c0;
            font-size: 1.4em;
        }

        /* Gümüş */
        .rank-3 {
            color: #cd7f32;
            font-size: 1.3em;
        }

        /* Bronz */
        .badge-icon {
            display: inline-block;
            background: #c5a059;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 5px;
        }

        .tab-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: 1px solid #c5a059;
            background: transparent;
            color: #c5a059;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.1em;
        }

        .tab-btn.active {
            background: #c5a059;
            color: white;
        }

        .lb-table {
            display: none;
        }

        .lb-table.active {
            display: table;
        }
    </style>
</head>

<body>

    <div class="leaderboard-container">
        <h2>🏆 LİDERLİK TABLOSU</h2>
        <p style="text-align: center; color: #777; margin-bottom: 20px;">En başarılı araştırmacılarla yarışın.</p>

        <div class="tab-container">
            <button class="tab-btn active" onclick="showTab('monthly', this)">📅 Bu Ay</button>
            <button class="tab-btn" onclick="showTab('alltime', this)">♾️ Tüm Zamanlar</button>
        </div>

        <!-- Aylık Tablo -->
        <table id="monthlyTable" class="lb-table active">
            <thead>
                <tr>
                    <th>Sıra</th>
                    <th>Kullanıcı</th>
                    <th>Aylık Puan</th>
                    <th>Rozetler</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user, iter : ${monthlyTopUsers}">
                    <td class="rank" th:classappend="'rank-' + (${iter.index} + 1)" th:text="${iter.index + 1}">1</td>
                    <td style="font-weight: bold;"
                        th:text="${user.firstName != null && user.lastName != null ? user.firstName + ' ' + user.lastName : user.username}">
                        Kullanıcı Adı</td>
                    <td th:text="${user.monthlyScore}">0</td>
                    <td>
                        <span th:if="${user.badges != null}" th:each="badge : ${user.badges.split(',')}"
                            class="badge-icon" th:text="${badge}">ROZET</span>
                        <span th:if="${user.badges == null or user.badges == ''}">-</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(monthlyTopUsers)}">
                    <td colspan="4" style="text-align:center; padding: 20px;">Bu ay henüz puan kazanan yok. İlk sen
                        ol!</td>
                </tr>
            </tbody>
        </table>

        <!-- Genel Tablo -->
        <table id="alltimeTable" class="lb-table">
            <thead>
                <tr>
                    <th>Sıra</th>
                    <th>Kullanıcı</th>
                    <th>Genel Puan</th>
                    <th>Rozetler</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user, iter : ${topUsers}">
                    <td class="rank" th:classappend="'rank-' + (${iter.index} + 1)" th:text="${iter.index + 1}">1</td>
                    <td style="font-weight: bold;"
                        th:text="${user.firstName != null && user.lastName != null ? user.firstName + ' ' + user.lastName : user.username}">
                        Kullanıcı Adı</td>
                    <td th:text="${user.totalScore}">0</td>
                    <td>
                        <span th:if="${user.badges != null}" th:each="badge : ${user.badges.split(',')}"
                            class="badge-icon" th:text="${badge}">ROZET</span>
                        <span th:if="${user.badges == null or user.badges == ''}">-</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/" style="text-decoration: none; color: #c5a059; font-weight: bold;">🏠 Ana Sayfaya Dön</a>
        </div>
    </div>

    <script>
        function showTab(type, btn) {
            // Hide all tables
            document.querySelectorAll('.lb-table').forEach(t => t.classList.remove('active'));
            // Deactivate buttons
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            // Activate selected
            if (type === 'monthly') {
                document.getElementById('monthlyTable').classList.add('active');
            } else {
                document.getElementById('alltimeTable').classList.add('active');
            }
            btn.classList.add('active');
        }
    </script>
</body>

</html>
