<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Sonuçlar - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            text-align: center;
            background: #f4f1ea;
            padding-top: 50px;
        }

        .result-card {
            background: white;
            padding: 50px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            background: #2c241b;
            color: #c5a059;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            margin: 0 auto 30px auto;
            border: 5px solid #c5a059;
        }

        .badge-box {
            background: #fff8e1;
            border: 2px dashed #d4af37;
            padding: 20px;
            margin-top: 20px;
            color: #8b6b00;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Interstitial Ad - Kategori Bitimi Reklamı -->
    <div id="adOverlay"
        style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column;">

        <div style="text-align: center; max-width: 600px; padding: 20px;">
            <p style="color: #888; margin-bottom: 20px; font-size: 0.9em;">Reklam</p>

            <!-- Ad Container - Replace with actual AdSense code -->
            <div style="width: 100%; min-height: 280px; background: linear-gradient(135deg, #1a1612, #2c241b); 
                border: 2px solid #c5a059; border-radius: 10px; display: flex; justify-content: center; 
                align-items: center; color: #c5a059; font-size: 1.2em; margin-bottom: 20px;">
                <!-- ins class="adsbygoogle" data-ad-client="ca-pub-XXXX" data-ad-slot="YYYY"></ins -->
                📢 Reklam Alanı (300x250)
            </div>

            <button id="skipAdBtn" onclick="closeAd()" disabled style="background: #555; color: #fff; border: none; padding: 15px 40px; font-size: 1em; 
                border-radius: 25px; cursor: not-allowed; transition: all 0.3s;">
                Reklam geçiliyor... <span id="adCountdown">5</span>
            </button>
        </div>
    </div>

    <script>
        // Ad countdown
        let adSeconds = 5;
        const countdownEl = document.getElementById('adCountdown');
        const skipBtn = document.getElementById('skipAdBtn');

        const adInterval = setInterval(() => {
            adSeconds--;
            if (adSeconds > 0) {
                countdownEl.textContent = adSeconds;
            } else {
                clearInterval(adInterval);
                skipBtn.disabled = false;
                skipBtn.style.background = '#c5a059';
                skipBtn.style.color = '#000';
                skipBtn.style.cursor = 'pointer';
                skipBtn.innerHTML = '✓ Sonuçlara Git';
            }
        }, 1000);

        function closeAd() {
            document.getElementById('adOverlay').style.display = 'none';
        }
    </script>

    <div class="result-card">
        <h1 style="font-family: 'Cinzel', serif; color: #2c241b;">🎯 Yarışma Sonucu</h1>

        <div class="score-circle" th:text="'%' + ${score}">%0</div>

        <p style="font-size: 18px;">
            Toplam <strong th:text="${totalCorrect}">0</strong> doğru cevap verdiniz.
        </p>

        <div th:if="${badgeMessage}" class="badge-box">
            <div style="font-size: 50px;">🏅</div>
            <p th:text="${badgeMessage}">Tebrikler</p>
        </div>

        <div th:if="${score < 80}" style="margin-top: 20px; color: #666;">
            Maalesef barajı geçemediniz. Biraz daha çalışıp tekrar deneyin! 📚
        </div>

        <!-- Bottom Ad Banner -->
        <div
            style="margin: 30px -30px -30px -30px; padding: 20px; background: #f5f5f5; border-top: 1px solid #ddd; text-align: center;">
            <p style="color: #888; font-size: 0.8em; margin-bottom: 10px;">Reklam</p>
            <div
                style="height: 90px; background: #e0e0e0; display: flex; justify-content: center; align-items: center; color: #666; border-radius: 5px;">
                📢 Reklam Alanı (728x90 Banner)
            </div>
        </div>

        <div style="margin-top: 40px;">
            <a href="/quiz" class="btn-action">Tekrar Dene</a>
            <a href="/" class="btn-action" style="background:#888;">Ana Sayfa</a>
        </div>
    </div>

</body>

</html>
