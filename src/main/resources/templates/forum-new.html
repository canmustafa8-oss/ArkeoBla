<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Yeni Konu Aç - ArkeoBlog</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: #1a1612;
            color: #dcd6ce;
            font-family: 'Lora', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background: #222;
            padding: 40px;
            border-radius: 10px;
            border: 1px solid #c5a059;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-family: 'Cinzel', serif;
            color: #c5a059;
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-family: inherit;
            box-sizing: border-box;
        }

        textarea {
            height: 200px;
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            background: #c5a059;
            color: #000;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-family: 'Cinzel';
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #d4af37;
            transform: scale(1.02);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
        }

        .back-link:hover {
            color: #c5a059;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Yeni Tartışma Başlat</h2>
        <form action="/forum/new" method="post">
            <label>Başlık</label>
            <input type="text" name="title" placeholder="Konu başlığı nedir?" required>

            <label>Kategori</label>
            <select name="category">
                <option value="Genel">Genel Sohbet</option>
                <option value="Keşifler">Yeni Keşifler</option>
                <option value="Sorular">Soru & Cevap</option>
                <option value="Teoriler">Teoriler & Gizemler</option>
            </select>

            <label>İçerik</label>
            <textarea name="content" placeholder="Detayları buraya yaz..." required></textarea>

            <button type="submit" class="btn-submit">Yayınla</button>
        </form>
        <a href="/forum" class="back-link">İptal ve Geri Dön</a>
    </div>
</body>

</html>
