<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ArkeoBla - Keşif Haritası 3D</title>
    <!-- Globe.gl -->
    <script src="//unpkg.com/globe.gl"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap"
        rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cinzel', serif;
            background: #000;
            color: #dcd6ce;
            overflow: hidden;
        }

        #globeViz {
            width: 100vw;
            height: 100vh;
        }

        .map-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        .map-header h1 {
            color: #c5a059;
            font-size: 2em;
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
        }

        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
            background: rgba(44, 36, 27, 0.8);
            color: #c5a059;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            border: 1px solid #c5a059;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .back-btn:hover {
            background: #c5a059;
            color: #000;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.6);
        }

        /* Tooltip styling */
        .scene-tooltip {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #c5a059;
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            max-width: 300px;
            font-family: 'Lora', serif;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .scene-tooltip b {
            font-family: 'Cinzel', serif;
            color: #c5a059;
            font-size: 1.2em;
            display: block;
            border-bottom: 1px solid #555;
            margin-bottom: 5px;
            padding-bottom: 5px;
        }

        .scene-tooltip img {
            width: 100%;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        /* Modal styling for details */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #c5a059;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            z-index: 2000;
            box-shadow: 0 0 50px rgba(197, 160, 89, 0.3);
            text-align: center;
        }

        .modal h2 {
            color: #c5a059;
            margin-bottom: 15px;
        }

        .modal p {
            font-family: 'Lora', serif;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .modal img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }

        .close-btn {
            background: #c5a059;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1999;
        }
    </style>
</head>

<body>
    <div id="globeViz"></div>

    <a href="/" class="back-btn">← Ana Sayfaya Dön</a>

    <div class="map-header">
        <h1>🌍 3D Geçmişin İzleri</h1>
    </div>

    <!-- Detail Modal -->
    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal" id="locationModal">
        <h2 id="modalTitle">Konum Adı</h2>
        <img id="modalImg" src="" alt="Location">
        <p id="modalDesc">Açıklama</p>
        <button class="close-btn" onclick="closeModal()">Kapat</button>
    </div>

    <script>
        const globe = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .pointOfView({ lat: 39.0, lng: 35.0, altitude: 2.0 }) // Start over Turkey
            .pointAltitude(0.05) // Yüksek noktalar (sütun gibi)
            .pointRadius(0.5)
            .pointColor(() => '#c5a059')
            .pointResolution(16)
            .labelLat(d => d.latitude)
            .labelLng(d => d.longitude)
            .labelText(d => d.name)
            .labelSize(1.5)
            .labelDotRadius(0.5)
            .labelColor(() => 'rgba(255, 255, 255, 0.75)')
            .labelResolution(2)
            .onLabelClick(d => showModal(d))
            .onPointClick(d => showModal(d))
            // Custom html tooltip
            .labelLabel(d => `
                <div class="scene-tooltip">
                    <b>${d.name}</b>
                    <div style="font-size:0.9em;">Click for details</div>
                </div>
            `);

        // Fetch data
        fetch('/api/locations')
            .then(res => res.json())
            .then(data => {
                globe
                    .pointsData(data)
                    .labelsData(data)
                    .pointLat(d => d.latitude)
                    .pointLng(d => d.longitude);
            });

        // Auto-rotate
        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.5;

        // Stop rotation on interaction
        globe.controls().addEventListener('start', () => { globe.controls().autoRotate = false; });

        // Modal functions
        function showModal(data) {
            globe.controls().autoRotate = false;
            document.getElementById('modalTitle').innerText = data.name;
            document.getElementById('modalDesc').innerText = data.description;
            document.getElementById('modalImg').src = data.imageUrl || '';

            document.getElementById('overlay').style.display = 'block';
            document.getElementById('locationModal').style.display = 'block';

            // Zoom to location
            globe.pointOfView({ lat: data.latitude, lng: data.longitude, altitude: 1.5 }, 1000);
        }

        function closeModal() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('locationModal').style.display = 'none';
            globe.controls().autoRotate = true;
        }
    </script>
</body>

</html>
