<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Premium Üyelik - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body style="background-image: none; background-color: #2c241b; color: white;">

    <div class="container" style="max-width: 600px; margin-top: 50px; text-align: center;">
        <h1 style="color: #c5a059;">💎 Premium Üyelik</h1>
        <p>ArkeoBla'nın tüm ayrıcalıklarına erişin. Sınırsız içerik, reklamsız deneyim.</p>

        <div th:if="${param.success}"
            style="background: #28a745; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
            <h3>🎉 Tebrikler! Premium Üyesiniz.</h3>
            <p>Ödemeniz başarıyla alındı (Simülasyon).</p>
            <a href="/" style="color: white; text-decoration: underline;">Anasayfaya Dön</a>
        </div>

        <div th:unless="${param.success}" class="menu-card"
            style="background: white; color: #333; padding: 30px; border-radius: 8px;">
            <h3>💳 Ödeme Bilgileri (Demo)</h3>
            <p style="font-size: 12px; color: gray;">Bu bir simülasyondur. Gerçek kart bilgilerinizi girmeyin.</p>

            <form th:action="@{/premium/subscribe}" method="post" style="text-align: left; margin-top: 20px;">
                <label style="display:block; margin-bottom:5px;">Kart Üzerindeki İsim</label>
                <input type="text" value="Ahmet Yılmaz"
                    style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd; border-radius:4px;">

                <label style="display:block; margin-bottom:5px;">Kart Numarası</label>
                <input type="text" value="0000 0000 0000 0000"
                    style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd; border-radius:4px;">

                <div style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label style="display:block; margin-bottom:5px;">SKT</label>
                        <input type="text" value="12/28"
                            style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                    <div style="flex:1;">
                        <label style="display:block; margin-bottom:5px;">CVC</label>
                        <input type="text" value="123"
                            style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;">
                    </div>
                </div>

                <button type="submit"
                    style="width:100%; margin-top:20px; padding:15px; background: #c5a059; color: white; border: none; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 4px;">99
                    TL / Ay - Abone Ol</button>
            </form>
        </div>

        <br>
        <a href="/" style="color: #c5a059;">← Vazgeç ve Dön</a>
    </div>

</body>

</html>
