<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ArkeoBla - Sanal Müze</title>
    <!-- SEO Meta Tags -->
    <meta name="description"
        content="ArkeoBla Sanal Müze ile antik eserleri 3D olarak inceleyin. Tarihi evinizden keşfedin.">
    <meta name="keywords"
        content="sanal müze, 3d eser inceleme, arkeoloji müzesi, dijital müze, antik heykeller, arkeobla museum">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://arkeobla.com/museum">
    <meta property="og:title" content="ArkeoBla - Sanal Müze">
    <meta property="og:description" content="Antik eserleri ve hazineleri 3D olarak evinizden inceleyin.">
    <meta property="og:image" content="https://arkeobla.com/img/museum-preview.jpg">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9786940799482882"
        crossorigin="anonymous"></script>

    <!-- Model Viewer Script (Google) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap"
        rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #dcd6ce;
            font-family: 'Lora', serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Menü */
        header {
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid #333;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #c5a059;
            text-decoration: none;
        }

        .back-btn {
            color: #dcd6ce;
            text-decoration: none;
            border: 1px solid #555;
            padding: 5px 15px;
            border-radius: 4px;
            transition: 0.3s;
        }

        .back-btn:hover {
            border-color: #c5a059;
            color: #c5a059;
        }

        /* Ana Sahne (3D Viewer) */
        .stage {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #2c241b 0%, #000 100%);
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        /* Bilgi Paneli */
        /* Bilgi Paneli (Alt Kısım) */
        .info-container {
            background: #111;
            padding: 20px 40px;
            text-align: center;
            border-top: 1px solid #333;
            border-bottom: 3px solid #c5a059;
        }

        .info-title {
            font-family: 'Cinzel', serif;
            color: #c5a059;
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        .info-desc {
            font-size: 16px;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            color: #ccc;
        }

        /* Alt Galeri Şeridi */
        .gallery-strip {
            height: 100px;
            background: #111;
            display: flex;
            align-items: center;
            overflow-x: auto;
            border-top: 1px solid #333;
            padding: 0 20px;
        }

        .artifact-card {
            min-width: 80px;
            height: 80px;
            margin-right: 15px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            opacity: 0.6;
            transition: 0.3s;
        }

        .artifact-card:hover,
        .artifact-card.active {
            border-color: #c5a059;
            opacity: 1;
            transform: scale(1.05);
        }

        .artifact-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <!-- Language Switcher -->
    <div style="position: fixed; top: 20px; right: 20px; display: flex; gap: 5px; z-index: 1000;">
        <a href="?lang=tr"
            style="padding: 6px 12px; border: 1px solid #c5a059; border-radius: 4px; color: #c5a059; text-decoration: none; font-size: 12px; background: rgba(0,0,0,0.5);">TR</a>
        <a href="?lang=en"
            style="padding: 6px 12px; border: 1px solid #c5a059; border-radius: 4px; color: #c5a059; text-decoration: none; font-size: 12px; background: rgba(0,0,0,0.5);">EN</a>
    </div>

    <header>
        <a href="/" class="brand" th:text="'🏛️ ' + #{museum.title}">🏛️ SANAL MÜZE</a>
        <a href="/" class="back-btn" th:text="#{header.home}">Ana Sayfaya Dön</a>
    </header>

    <div class="stage" id="stage-area">
        <!-- 3D MODEL GÖRÜNTÜLEYİCİ -->
        <model-viewer id="main-viewer" th:if="${artifacts[0].modelUrl != null and artifacts[0].modelUrl != ''}"
            th:src="${artifacts[0].modelUrl}" th:poster="${artifacts[0].posterUrl}" alt="3D Artifact" auto-rotate
            camera-controls shadow-intensity="1" exposure="1" environment-image="neutral"></model-viewer>

        <!-- 2D IMAGE FALLBACK -->
        <img id="main-image" th:if="${artifacts[0].modelUrl == null or artifacts[0].modelUrl == ''}"
            th:src="${artifacts[0].posterUrl}" style="width:100%; height:100%; object-fit:contain; display:block;"
            alt="Artifact Image">

        <img id="main-image-hidden" style="width:100%; height:100%; object-fit:contain; display:none;"
            alt="Artifact Image">
    </div>

    <!-- Bilgi Paneli (Sahnenin Altında) -->
    <div class="info-container">
        <h2 class="info-title" id="info-title" th:text="${artifacts[0].name}">Eser Adı</h2>
        <p class="info-desc" id="info-desc" th:text="${artifacts[0].description}">Açıklama</p>
    </div>

    <div class="gallery-strip">
        <div th:each="art, iter : ${artifacts}" class="artifact-card" th:classappend="${iter.index == 0} ? 'active'"
            th:onclick="changeArtifact([[${art.modelUrl}]], [[${art.posterUrl}]], [[${art.name}]], [[${art.description}]], this)">
            <img th:src="${art.posterUrl}" alt="Thumbnail" onerror="this.src='/img/placeholder.png'">
        </div>
    </div>

    <script>
        function changeArtifact(modelUrl, posterUrl, name, desc, element) {
            const viewer = document.getElementById('main-viewer');
            const img = document.getElementById('main-image') || document.getElementById('main-image-hidden');
            const title = document.getElementById('info-title');
            const descElem = document.getElementById('info-desc');

            // Bilgileri Güncelle
            title.innerText = name;
            descElem.innerText = desc;

            // Görsel/Model Değişimi
            if (modelUrl && modelUrl.trim() !== '') {
                // 3D Model Var
                if (viewer) {
                    viewer.style.display = 'block';
                    viewer.src = modelUrl;
                    viewer.poster = posterUrl;
                }
                if (img) img.style.display = 'none';
            } else {
                // Sadece 2D Görsel
                if (viewer) viewer.style.display = 'none';
                if (img) {
                    img.style.display = 'block';
                    img.src = posterUrl;
                }
            }

            // Görsel Efekt (Active Class)
            document.querySelectorAll('.artifact-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>

</html>
