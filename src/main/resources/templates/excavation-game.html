<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="'Kazı: ' + ${regionName}">Kazı Simülatörü - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Cinzel', serif;
            background: #1a1612;
            color: #dcd6ce;
            user-select: none;
            overflow-x: hidden;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            height: 100vh;
        }

        /* Left Panel: Stats */
        .panel-left {
            background: #2c241b;
            padding: 20px;
            border-right: 2px solid #c5a059;
            overflow-y: auto;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #5d4037;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-title {
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #c5a059;
            font-size: 1.5em;
            font-weight: bold;
        }

        /* Center: Excavation Site */
        .excavation-site {
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .active-layer-info {
            position: absolute;
            top: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 30px;
            border-radius: 20px;
            border: 1px solid #c5a059;
            z-index: 10;
        }

        canvas {
            border: 4px solid #5d4037;
            cursor: crosshair;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* Right Panel: Tools & Log */
        .panel-right {
            background: #2c241b;
            padding: 20px;
            border-left: 2px solid #c5a059;
            display: flex;
            flex-direction: column;
        }

        .tool-btn {
            background: #3e2723;
            border: 1px solid #c5a059;
            color: #ccc;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-btn:hover {
            background: #4e342e;
        }

        .tool-btn.active {
            background: #c5a059;
            color: #000;
            font-weight: bold;
        }

        .log-console {
            margin-top: auto;
            height: 200px;
            background: black;
            border: 1px solid #333;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #0f0;
            overflow-y: auto;
        }

        /* Modal for Analysis */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #2c241b;
            padding: 40px;
            border: 2px solid #c5a059;
            max-width: 500px;
            text-align: center;
        }

        .modal img {
            max-width: 100%;
            border: 4px solid #fff;
            margin: 20px 0;
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <!-- LEFT PANEL -->
        <div class="panel-left">
            <h2 style="color:#c5a059; text-align:center; margin-bottom:30px;">STRATIGRAFİ</h2>

            <div class="stat-box">
                <div class="stat-title">Bütçe</div>
                <div class="stat-value" id="budgetDisplay" th:text="${budget} + ' TL'">5000 TL</div>
            </div>

            <div class="stat-box">
                <div class="stat-title">Enerji</div>
                <div class="stat-value" id="energyDisplay">100%</div>
            </div>

            <hr style="border-color:#555; margin:20px 0;">

            <h3 style="color:#ddd; font-size:1em; margin-bottom:15px;">Katmanlar</h3>
            <div id="layerList">
                <div th:each="layer : ${layers}" class="tool-btn" th:id="'layerBtn-' + ${layer.level}"
                    style="font-size:0.8em; opacity:0.5; padding: 10px;">
                    <span th:text="${layer.level} + '. ' + ${layer.name}">1. Modern</span>
                    <span th:if="${layer.level == 1}">👁️</span>
                </div>
            </div>
        </div>

        <!-- CENTER SITE -->
        <div class="excavation-site">
            <div class="active-layer-info" id="activeLayerInfo">
                KATMAN 1: MODERN YÜZEY
            </div>

            <!-- Stacked Canvases for Layers? Or just one canvas re-rendered? -->
            <!-- Simple approach: One canvas, but we track logic virtually -->
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>

        <!-- RIGHT PANEL -->
        <div class="panel-right">
            <h3 style="color:#c5a059; margin-bottom:20px;">ARAÇLAR</h3>

            <button class="tool-btn active" onclick="setTool('trowel', 10, 5)">
                <span>Malas (Hassas)</span>
                <span style="font-size:0.8em">-5 TL / -1 E</span>
            </button>

            <button class="tool-btn" onclick="setTool('pickaxe', 50, 15)">
                <span>Kazma (Kaba)</span>
                <span style="font-size:0.8em">-20 TL / -5 E</span>
            </button>

            <button class="tool-btn" onclick="setTool('radar', 0, 50)">
                <span>Jeoradar (Tarama)</span>
                <span style="font-size:0.8em">-500 TL / -10 E</span>
            </button>

            <div class="log-console" id="gameLog">
                > Kazı başlatıldı...<br>
                > Bölge: <span th:text="${regionName}"></span><br>
                > Hedef: Katmanları inerek Neolitik çağa ulaş.<br>
            </div>

            <a href="/excavation" style="margin-top:20px; text-align:center; color:#666; text-decoration:none;">Kazıyı
                Bitir</a>
        </div>
    </div>

    <!-- ANALYSIS MODAL -->
    <div class="modal" id="analysisModal">
        <div class="modal-content">
            <h2 style="color:#c5a059">Buluntu Analizi</h2>
            <p>Laboratuvar sonuçları bekleniyor...</p>
            <div id="analysisResult" style="display:none;">
                <img id="foundImg" src="" alt="Artifact">
                <h3 id="foundTitle"></h3>
                <p id="foundDesc"></p>
                <button class="tool-btn active" style="justify-content:center; margin-top:20px;" onclick="closeModal()">
                    Müzeye Gönder (+Puan)
                </button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const layers = /*[[${layers}]]*/[];
        let currentLayerIndex = 0;

        // Game State
        let budget = /*[[${budget}]]*/ 5000;
        let energy = 100;

        // Tools
        let currentTool = { name: 'trowel', radius: 15, cost: 5, energyCost: 1 };

        // Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Setup first layer
        function initLayer(index) {
            currentLayerIndex = index;
            const layer = layers[index];

            // Update UI
            document.getElementById('activeLayerInfo').innerText = `KATMAN ${layer.level}: ${layer.name.toUpperCase()}`;
            document.getElementById('layerBtn-' + layer.level).style.opacity = '1';
            document.getElementById('layerBtn-' + layer.level).innerHTML += ' ⛏️';

            log(`Katman ${layer.level} çalışması başladı: ${layer.description}`);

            // Reset Canvas with Dirt Color based on depth
            // Deeper = Darker
            const darkness = 50 - (index * 10);
            ctx.fillStyle = `hsl(30, 40%, ${darkness}%)`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Embed artifact logic (Hidden)
            // For simulation, we randomly place "hotspots"
        }

        function setTool(name, cost, energyCost) {
            currentTool = { name, radius: name === 'trowel' ? 15 : 40, cost, energyCost };

            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            log(`Araç seçildi: ${name.toUpperCase()}`);
        }

        canvas.addEventListener('mousedown', (e) => {
            if (budget < currentTool.cost || energy < currentTool.energyCost) {
                log("Yetersiz kaynak!");
                return;
            }

            updateResources(-currentTool.cost, -currentTool.energyCost);

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Dig visual
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            if (currentTool.name === 'radar') {
                // Radar just highlights, doesn't dig? Or reveals?
                // Let's make radar reveal an area without removing dirt permanently? 
                // For simplicity, let's make radar a big distinct circle
                ctx.arc(x, y, 100, 0, Math.PI * 2);
            } else {
                ctx.arc(x, y, currentTool.radius, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            // Check for find (Simulation)
            // 5% chance to find something in this click
            if (Math.random() < 0.05) {
                foundArtifact();
            }
        });

        function foundArtifact() {
            const layer = layers[currentLayerIndex];
            if (!layer.potentialFinds || layer.potentialFinds.length === 0) return;

            const artifact = layer.potentialFinds[0]; // Get first for demo

            log(`BULUNTU! ${artifact.name} tespit edildi.`);

            // Show Modal
            const modal = document.getElementById('analysisModal');
            const res = document.getElementById('analysisResult');
            modal.style.display = 'flex';

            setTimeout(() => {
                document.querySelector('#analysisModal p').style.display = 'none';
                res.style.display = 'block';
                document.getElementById('foundImg').src = artifact.imageUrl;
                document.getElementById('foundTitle').innerText = artifact.name;
                document.getElementById('foundDesc').innerText = artifact.description;
            }, 1500); // Fake analysis delay
        }

        function closeModal() {
            document.getElementById('analysisModal').style.display = 'none';

            // Check if layer complete (Simulated)
            // If find is made, move to next layer?
            if (currentLayerIndex < layers.length - 1) {
                log("Katman tamamlandı. Bir alt katmana iniliyor...");
                setTimeout(() => {
                    initLayer(currentLayerIndex + 1);
                }, 1000);
            } else {
                log("Tebrikler! Ana kayaya ulaşıldı. Kazı bitti.");
                alert("Kazı Tamamlandı! Tüm veriler kaydedildi.");
                window.location = '/excavation';
            }
        }

        function updateResources(moneyDelta, energyDelta) {
            budget += moneyDelta;
            energy += energyDelta;

            document.getElementById('budgetDisplay').innerText = budget + ' TL';
            document.getElementById('energyDisplay').innerText = energy + '%';

            if (energy <= 0) {
                alert("Enerjiniz tükendi! Kazı ekibi dinlenmek zorunda.");
                window.location = '/excavation';
            }
        }

        function log(msg) {
            const console = document.getElementById('gameLog');
            console.innerHTML += `> ${msg}<br>`;
            console.scrollTop = console.scrollHeight;
        }

        // Start
        initLayer(0);
    </script>

</body>

</html>
