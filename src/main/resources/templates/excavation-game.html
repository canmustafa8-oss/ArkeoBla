<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="'Kazı: ' + ${regionName}">Kazı Simülatörü - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cinzel', serif;
            background: linear-gradient(to bottom, #8B7355 0%, #6B5444 50%, #4A3728 100%);
            color: #dcd6ce;
            overflow-x: hidden;
            user-select: none;
        }

        .game-header {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #c5a059;
        }

        .game-header h1 {
            color: #c5a059;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 5px;
        }

        .region-name {
            color: #fff;
            font-size: 1.2em;
            font-weight: normal;
        }

        .game-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #8B7355;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            color: #c5a059;
            font-weight: bold;
        }

        .stat-label {
            color: #aaa;
            font-size: 0.9em;
        }

        .excavation-area {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .dirt-layer {
            position: relative;
            width: 100%;
            height: 500px;
            background: linear-gradient(135deg, #8B7355 0%, #6B5444 50%, #4A3728 100%);
            cursor: crosshair;
            overflow: hidden;
        }

        .dirt-particles {
            position: absolute;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .artifact-revealed {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 300px;
            height: 300px;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.8);
            transition: transform 0.5s ease;
            opacity: 0;
        }

        .artifact-revealed.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .tools {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: linear-gradient(135deg, #3e2723, #5d4037);
            border: 3px solid #8B7355;
            color: #dcd6ce;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cinzel', serif;
            font-size: 1em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tool-btn:hover {
            background: linear-gradient(135deg, #5d4037, #4e342e);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(197, 160, 89, 0.3);
        }

        .tool-btn.active {
            border-color: #c5a059;
            background: linear-gradient(135deg, #c5a059, #b8935a);
            color: #000;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.6);
        }

        .tool-icon {
            font-size: 1.5em;
        }

        .progress-bar {
            width: 100%;
            max-width: 800px;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow: hidden;
            margin: 20px auto;
            border: 2px solid #8B7355;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #c5a059, #d4a574);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #2c241b, #1a1612);
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            text-align: center;
            border: 5px solid #c5a059;
            box-shadow: 0 0 50px rgba(197, 160, 89, 0.5);
            animation: modalPop 0.5s ease;
        }

        @keyframes modalPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #c5a059;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .artifact-image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            margin: 20px auto;
            border: 4px solid #c5a059;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .artifact-info {
            color: #ddd;
            line-height: 1.8;
            font-size: 1.1em;
            margin: 20px 0;
        }

        .artifact-title {
            color: #fff;
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .artifact-desc {
            color: #aaa;
            font-style: italic;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-family: 'Cinzel', serif;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c5a059, #b8935a);
            color: #000;
            font-weight: bold;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(197, 160, 89, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid #666;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .instruction {
            background: rgba(197, 160, 89, 0.1);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #c5a059;
            margin-bottom: 20px;
            text-align: left;
        }

        .instruction p {
            margin: 5px 0;
            color: #ddd;
        }

        @media (max-width: 768px) {
            .game-header h1 {
                font-size: 1.8em;
            }

            .dirt-layer {
                height: 350px;
            }

            .tools {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="game-header">
        <h1>⛏️ Arkeolojik Kazı Simülatörü</h1>
        <p class="region-name" th:text="${regionName}">Bölge Adı</p>
    </div>

    <div class="game-container">
        <div class="instruction">
            <p><strong>📋 Talimatlar:</strong></p>
            <p>🖱️ Fareyle toprağı kazıyın ve gizli eserleri ortaya çıkarın</p>
            <p>🔍 Dikkatli olun - bazı eserler çok narindir!</p>
            <p>⭐ Her keşif sizin için bir başarıdır!</p>
        </div>

        <div class="info-panel">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="progressPercent">0%</div>
                    <div class="stat-label">Kazılmış Alan</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="artifactCount">0</div>
                    <div class="stat-label">Bulunan Eser</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalArtifacts" th:text="${artifacts.size()}">5</div>
                    <div class="stat-label">Toplam Eser</div>
                </div>
            </div>
        </div>

        <div class="tools">
            <button class="tool-btn active" data-tool="brush" onclick="selectTool('brush')">
                <span class="tool-icon">🖌️</span>
                <span>Fırça (Küçük)</span>
            </button>
            <button class="tool-btn" data-tool="shovel" onclick="selectTool('shovel')">
                <span class="tool-icon">⛏️</span>
                <span>Kazma (Orta)</span>
            </button>
            <button class="tool-btn" data-tool="excavator" onclick="selectTool('excavator')">
                <span class="tool-icon">🚜</span>
                <span>Ekskavatör (Büyük)</span>
            </button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill">0%</div>
        </div>

        <div class="excavation-area">
            <div class="dirt-layer" id="dirtLayer">
                <canvas id="dirtCanvas"></canvas>
                <div class="dirt-particles" id="particles"></div>
            </div>
        </div>
    </div>

    <!-- Artifact Discovery Modal -->
    <div class="modal" id="artifactModal">
        <div class="modal-content">
            <h2>🎉 Eser Bulundu!</h2>
            <div class="artifact-title" id="artifactTitle">Eser Adı</div>
            <img id="artifactImage" class="artifact-image" src="" alt="Artifact">
            <div class="artifact-desc" id="artifactDesc">Eser Açıklaması</div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="continueExcavation()">Kaz İlmeye Devam Et</button>
                <button class="btn btn-secondary" onclick="location.href='/excavation'">Bölge Seç</button>
            </div>
        </div>
    </div>

    <!-- Hidden artifact data -->
    <div id="artifactsData" style="display:none;" th:attr="data-artifacts=${artifactsJson}"></div>

    <script th:inline="javascript">
        const artifactsData = /*[[${artifacts}]]*/[];
        const canvas = document.getElementById('dirtCanvas');
        const ctx = canvas.getContext('2d');
        const dirtLayer = document.getElementById('dirtLayer');

        // Canvas setup
        canvas.width = dirtLayer.offsetWidth;
        canvas.height = dirtLayer.offsetHeight;

        // Game state
        let currentTool = 'brush';
        let toolSizes = { brush: 20, shovel: 40, excavator: 60 };
        let isDrawing = false;
        let clearedPixels = 0;
        let totalPixels = canvas.width * canvas.height;
        let foundArtifacts = 0;
        let currentArtifactIndex = 0;
        let artifactRevealed = false;

        // Initialize dirt texture
        function initDirt() {
            ctx.fillStyle = '#8B7355';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add texture
            for (let i = 0; i < 5000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const shade = Math.floor(Math.random() * 50) - 25;
                ctx.fillStyle = `rgb(${139 + shade}, ${115 + shade}, ${85 + shade})`;
                ctx.fillRect(x, y, 2, 2);
            }
        }

        initDirt();

        // Tool selection
        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-tool="${tool}"]`).classList.add('active');
        }

        // Digging mechanic
        function dig(x, y) {
            const size = toolSizes[currentTool];
            const imageData = ctx.getImageData(Math.max(0, x - size), Math.max(0, y - size), size * 2, size * 2);

            for (let i = 0; i < imageData.data.length; i += 4) {
                const alpha = imageData.data[i + 3];
                if (alpha > 0) clearedPixels++;
                imageData.data[i + 3] = 0; // Make transparent
            }

            ctx.putImageData(imageData, Math.max(0, x - size), Math.max(0, y - size));

            // Create particle effect
            createParticles(x, y, size);

            // Update progress
            updateProgress();
        }

        function createParticles(x, y, size) {
            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = '4px';
                particle.style.height = '4px';
                particle.style.background = '#8B7355';
                particle.style.borderRadius = '50%';
                particle.style.pointerEvents = 'none';

                document.getElementById('particles').appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 3 + 1;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity - 2;

                animateParticle(particle, vx, vy);
            }
        }

        function animateParticle(particle, vx, vy) {
            let x = parseInt(particle.style.left);
            let y = parseInt(particle.style.top);
            let gravity = 0.2;

            function update() {
                vy += gravity;
                x += vx;
                y += vy;

                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.opacity = parseFloat(particle.style.opacity || 1) - 0.02;

                if (parseFloat(particle.style.opacity) > 0) {
                    requestAnimationFrame(update);
                } else {
                    particle.remove();
                }
            }

            update();
        }

        function updateProgress() {
            const progress = Math.min(100, (clearedPixels / totalPixels * 100) * 10);
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressPercent').textContent = Math.floor(progress) + '%';
            document.getElementById('progressFill').textContent = Math.floor(progress) + '%';

            // Check for artifact reveal
            if (progress > 30 && !artifactRevealed && currentArtifactIndex < artifactsData.length) {
                revealArtifact();
            }
        }

        function revealArtifact() {
            artifactRevealed = true;
            const artifact = artifactsData[currentArtifactIndex];

            // Confetti effect
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            // Show modal
            document.getElementById('artifactTitle').textContent = artifact.name;
            document.getElementById('artifactImage').src = artifact.imageUrl;
            document.getElementById('artifactDesc').textContent = artifact.description;
            document.getElementById('artifactModal').classList.add('show');

            foundArtifacts++;
            document.getElementById('artifactCount').textContent = foundArtifacts;
        }

        function continueExcavation() {
            document.getElementById('artifactModal').classList.remove('show');
            artifactRevealed = false;
            currentArtifactIndex++;
            clearedPixels = 0;
            initDirt();

            if (currentArtifactIndex >= artifactsData.length) {
                alert('🎊 Tebrikler! Tüm eserleri buldunuz!');
                location.href = '/excavation';
            }
        }

        // Mouse events
        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            dig(x, y);
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            e.preventDefault();
        });

        canvas.addEventListener('touchend', () => isDrawing = false);

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
            dig(x, y);
        });
    </script>
</body>

</html>
