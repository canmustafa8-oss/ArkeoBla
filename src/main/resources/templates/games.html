<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{games.title} + ' - ArkeoBla'">Oyun Alanı - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cinzel', serif;
            background-color: #1a1a1a;
            color: #dcd6ce;
        }

        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 5px;
            z-index: 1000;
        }

        .lang-switcher a {
            padding: 6px 12px;
            border: 1px solid #c5a059;
            border-radius: 4px;
            color: #c5a059;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s;
        }

        .lang-switcher a:hover {
            background: #c5a059;
            color: #000;
        }

        .games-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #c5a059;
            margin-bottom: 10px;
            font-size: 3em;
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.3);
        }

        .subtitle {
            color: #888;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .game-card {
            background: #2c241b;
            border: 1px solid #444;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: #c5a059;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .game-img-container {
            height: 200px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #444;
            font-size: 50px;
        }

        .game-content {
            padding: 20px;
        }

        .game-title {
            font-size: 1.5em;
            color: #c5a059;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .game-desc {
            font-family: 'Lora', serif;
            font-size: 0.9em;
            color: #bbb;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <!-- Language Switcher -->
    <div class="lang-switcher">
        <a href="?lang=tr">TR</a>
        <a href="?lang=en">EN</a>
    </div>

    <div class="games-container">
        <h1 th:text="#{games.title}">🎮 OYUN ALANI</h1>
        <p class="subtitle" th:text="#{games.subtitle}">Eğlenerek tarih öğren!</p>

        <div class="games-grid">

            <!-- Quiz -->
            <a href="/quiz" class="game-card">
                <div class="game-img-container">🧠</div>
                <div class="game-content">
                    <div class="game-title" th:text="#{games.quiz.title}">Arkeo-Quiz</div>
                    <div class="game-desc" th:text="#{games.quiz.desc}">Bilgilerini test et ve rozet kazan!</div>
                </div>
            </a>

            <!-- Puzzle -->
            <a href="/puzzle" class="game-card">
                <div class="game-img-container">🧩</div>
                <div class="game-content">
                    <div class="game-title" th:text="#{games.puzzle.title}">Tarihi Puzzle</div>
                    <div class="game-desc" th:text="#{games.puzzle.desc}">Antik eser parçalarını birleştir</div>
                </div>
            </a>

            <!-- Excavation -->
            <a href="/excavation" class="game-card">
                <div class="game-img-container">⛏️</div>
                <div class="game-content">
                    <div class="game-title" th:text="#{games.excavation.title}">Kazı Simülatörü</div>
                    <div class="game-desc" th:text="#{games.excavation.desc}">Gerçek arkeoloji deneyimi yaşa</div>
                </div>
            </a>

        </div>

        <div style="margin-top: 50px;">
            <a href="/" style="color: #c5a059; text-decoration: none; font-size: 1.1em;"
                th:text="'🏠 ' + #{header.home}">🏠 Ana Sayfaya Dön</a>
        </div>
    </div>

</body>

</html>
