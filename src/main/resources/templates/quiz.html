<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ArkeoBla - Bilgi Yarışması</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1612, #2c241b);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
        }

        .quiz-container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-top: 8px solid #c5a059;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .quiz-header h2 {
            color: #2c241b;
            font-family: 'Cinzel', serif;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .quiz-header p {
            color: #666;
            font-size: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #c5a059, #d4a574);
            width: 0%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .question-card {
            background: #fafafa;
            margin-bottom: 30px;
            padding: 30px;
            border-radius: 10px;
            border-left: 5px solid #c5a059;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .question-number {
            color: #c5a059;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 20px;
            font-weight: bold;
            color: #2c241b;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            font-size: 16px;
        }

        .option-label:hover {
            background-color: #f9f9f9;
            border-color: #c5a059;
            transform: translateX(5px);
        }

        .option-label input {
            margin-right: 15px;
            cursor: pointer;
            width: 20px;
            height: 20px;
            accent-color: #c5a059;
        }

        .option-label.selected {
            background-color: #fff8e7;
            border-color: #c5a059;
            font-weight: 500;
        }

        .option-label.correct {
            background-color: #d4edda;
            color: #155724;
            border-color: #28a745;
            font-weight: bold;
        }

        .option-label.wrong {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #dc3545;
        }

        .option-label.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        .submit-btn {
            background: linear-gradient(135deg, #2c241b, #3e3226);
            color: #c5a059;
            padding: 18px 40px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-family: 'Cinzel', serif;
            transition: 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #3e3226, #2c241b);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin: 20px 0;
            color: #c5a059;
            text-decoration: none;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .empty-warning {
            text-align: center;
            padding: 60px 40px;
            background: #fff3cd;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .empty-warning p {
            color: #856404;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .timer {
            text-align: center;
            font-size: 24px;
            color: #c5a059;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header style="background:#2c241b; padding:20px; text-align:center; position: relative;">
        <a href="/games"
            style="position: absolute; left: 20px; top: 20px; color: #c5a059; text-decoration: none; font-size: 1.2em;">←
            Geri</a>
        <a href="/" style="color:#c5a059; font-family:'Cinzel', serif; font-size:28px; text-decoration:none;">
            🧠 Arkeo-Quiz
        </a>
    </header>

    <div class="quiz-container">
        <div class="quiz-header">
            <h2>🏆 Bilgini Test Et, Rozeti Kap!</h2>
            <p>Kategori: <strong th:text="${selectedCategory}">Arkeoloji</strong></p>
            <p>Aşağıdaki soruları bil, <strong>%80 barajını geç</strong> ve <strong style="color:#c5a059;">'BİLGE
                    KAŞİF'</strong> rozetini kazan!</p>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar" id="progressBar" th:if="${questions != null and not questions.empty}">
            <div class="progress-fill" id="progressFill">0%</div>
        </div>

        <form action="/quiz/submit" method="post" id="quizForm">
            <!-- No CSRF token needed as CSRF is disabled -->

            <!-- Empty Question Warning -->
            <div th:if="${questions == null or questions.empty}" class="empty-warning">
                <p>⚠️ Bu kategoride henüz soru bulunamadı.</p>
                <a href="/quiz" class="back-link">← Başka bir kategori seçin</a>
            </div>

            <!-- Questions -->
            <div th:each="q, iterStat : ${questions}" class="question-card" th:data-correct="${q.correctAnswer}"
                th:id="'question-' + ${q.id}">
                <div class="question-number" th:text="'Soru ' + (${iterStat.index} + 1) + '/' + ${questions.size()}">
                    Soru 1/5
                </div>
                <div class="question-text" th:text="${q.text}">Soru Metni</div>

                <div class="options">
                    <label th:each="opt : ${q.options}" class="option-label">
                        <input type="radio" th:name="'q' + ${q.id}" th:value="${opt}" required
                            onchange="handleAnswerSelect(this)">
                        <span th:text="${opt}">Seçenek</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn"
                th:if="${questions != null and not questions.empty}">
                🎯 YARIŞMAYI BİTİR VE SONUCU GÖR
            </button>
        </form>

        <a href="/quiz" class="back-link">← Kategori Seçimine Dön</a>
    </div>

    <script>
        let totalQuestions = document.querySelectorAll('.question-card').length;
        let answeredCount = 0;

        function handleAnswerSelect(radio) {
            const questionCard = radio.closest('.question-card');
            const correctAnswer = questionCard.getAttribute('data-correct');
            const selectedValue = radio.value;

            // If already answered, don't process again
            if (questionCard.classList.contains('answered')) {
                return;
            }

            // Mark as answered
            questionCard.classList.add('answered');

            // Get all options
            const allLabels = questionCard.querySelectorAll('.option-label');

            allLabels.forEach(label => {
                const labelRadio = label.querySelector('input[type="radio"]');
                const labelValue = labelRadio.value;

                // Disable all options
                label.classList.add('disabled');
                labelRadio.disabled = true;

                // Mark correct answer in green
                if (labelValue === correctAnswer) {
                    label.classList.add('correct');
                    label.querySelector('span').innerHTML += ' ✅';
                }

                // Mark wrong selection in red (if user selected wrong answer)
                if (label === radio.closest('.option-label') && selectedValue !== correctAnswer) {
                    label.classList.add('wrong');
                    label.querySelector('span').innerHTML += ' ❌';
                }

                // Highlight user's selection even if correct
                if (label === radio.closest('.option-label')) {
                    label.classList.add('selected');
                }
            });

            // Update progress
            updateProgress();
        }

        function updateProgress() {
            let answered = document.querySelectorAll('input[type="radio"]:checked').length;
            let percentage = Math.round((answered / totalQuestions) * 100);
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressFill').textContent = percentage + '%';

            // Enable submit button only when all questions answered
            if (answered === totalQuestions) {
                document.getElementById('submitBtn').disabled = false;
            }
        }

        // Disable submit initially
        if (totalQuestions > 0) {
            document.getElementById('submitBtn').disabled = true;
        }

        // Prevent double submission & enable inputs for submission
        document.getElementById('quizForm')?.addEventListener('submit', function (e) {
            // Disabled inputs are NOT sent in form submission
            // We must re-enable them right before submitting
            const allRadios = document.querySelectorAll('input[type="radio"]');
            allRadios.forEach(radio => {
                radio.disabled = false;
            });

            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').textContent = 'Gönderiliyor...';
        });
    </script>

</body>

</html>
