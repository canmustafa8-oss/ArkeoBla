<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Zaman Makinesi - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Cinzel', serif;
            background-color: #000;
            color: #dcd6ce;
            text-align: center;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            color: #c5a059;
            margin-bottom: 10px;
            font-size: 3em;
            text-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            letter-spacing: 3px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 50px;
            font-family: 'Lora', serif;
            font-style: italic;
        }

        /* Timeline Slider Container */
        .timeline-container {
            display: flex;
            overflow-x: auto;
            padding: 20px 0;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .timeline-container::-webkit-scrollbar {
            height: 8px;
            background: #111;
        }

        .timeline-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        .era-card {
            min-width: 250px;
            height: 350px;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            border: 1px solid #333;
            transition: all 0.4s ease;
            filter: grayscale(80%);
            text-decoration: none;
        }

        .era-card:hover,
        .era-card.active {
            filter: grayscale(0%);
            transform: scale(1.05);
            border-color: #c5a059;
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.2);
            z-index: 10;
        }

        .era-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            box-sizing: border-box;
            text-align: left;
        }

        .era-title {
            font-size: 1.2em;
            color: #fff;
            margin: 0;
        }

        .era-period {
            font-size: 0.9em;
            color: #c5a059;
            margin-top: 5px;
            font-family: 'Lora', serif;
        }

        /* Selected Era Display */
        .selected-era-display {
            margin-top: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 16px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 40px;
            text-align: left;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .big-image {
            width: 400px;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .info-content {
            flex: 1;
        }

        .info-title {
            font-size: 2.5em;
            color: #c5a059;
            margin: 0 0 10px 0;
        }

        .info-period {
            font-size: 1.2em;
            color: #888;
            margin-bottom: 20px;
            display: block;
        }

        .info-desc {
            font-family: 'Lora', serif;
            font-size: 1.1em;
            line-height: 1.6;
            color: #ddd;
        }

        .back-btn {
            display: inline-block;
            margin-top: 40px;
            color: #888;
            text-decoration: none;
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #c5a059;
            color: #000;
            border-color: #c5a059;
        }

        @media (max-width: 800px) {
            .selected-era-display {
                flex-direction: column;
            }

            .big-image {
                width: 100%;
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>⏳ ZAMAN MAKİNESİ</h1>
        <p class="subtitle">Geçmişe doğru bir yolculuğa çıkın ve tarihin dönüm noktalarına tanıklık edin.</p>

        <!-- Timeline -->
        <div class="timeline-container">
            <a th:each="era : ${eras}" th:href="@{/time-machine(era=${era.id})}" class="era-card"
                th:classappend="${selectedEra != null and selectedEra.id == era.id} ? 'active'"
                th:style="'background-image: url(' + ${era.imageUrl} + ');'">

                <div class="era-content">
                    <span class="era-category" th:text="${era.category}"
                        style="font-size: 0.8em; color: #c5a059; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px;">Kategori</span>
                    <h3 class="era-title" th:text="${era.title}">Dönem</h3>
                    <div class="era-period" th:text="${era.period}">Tarih</div>
                </div>
            </a>
        </div>

        <!-- Selected Content -->
        <div th:if="${selectedEra}" class="selected-era-display">
            <img th:src="${selectedEra.imageUrl}" class="big-image">
            <div class="info-content">
                <h2 class="info-title" th:text="${selectedEra.title}">Başlık</h2>
                <span class="info-period" th:text="${selectedEra.period}">Dönem</span>
                <p class="info-desc" th:text="${selectedEra.description}">Açıklama</p>

                <div style="margin-top: 20px;">
                    <a th:href="@{'/time-machine/era/' + ${selectedEra.id}}" class="btn"
                        style="background:#c5a059; color:#000; font-weight:bold; padding:10px 25px; border-radius:4px; text-decoration:none;">🚀
                        Bu Döneme Işınlan</a>
                </div>
            </div>
        </div>

        <div th:if="${selectedEra == null}" style="margin-top: 50px; color: #666; font-style: italic;">
            <p>👆 Yukarıdaki zaman çizelgesinden bir dönem seçin.</p>
        </div>

        <a href="/" class="back-btn">🏠 Günümüze Dön</a>
    </div>

</body>

</html>
