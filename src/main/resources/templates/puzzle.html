<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Tarihi Puzzle - ArkeoBla</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #1a1612, #2c241b);
            color: #dcd6ce;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-header h1 {
            color: #c5a059;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .level-info {
            color: #aaa;
            font-size: 1.2em;
        }

        .puzzle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .puzzle-board {
            display: grid;
            gap: 3px;
            background: #000;
            padding: 3px;
            border: 5px solid #c5a059;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .puzzle-piece {
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .puzzle-piece:hover {
            opacity: 0.7;
            border-color: #fff;
            transform: scale(0.95);
        }

        .puzzle-piece.selected {
            border-color: #e74c3c;
            transform: scale(0.9);
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: linear-gradient(135deg, #c5a059, #b8935a);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            font-family: 'Cinzel', serif;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(197, 160, 89, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #2c241b, #1a1612);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 5px solid #c5a059;
            box-shadow: 0 0 50px rgba(197, 160, 89, 0.5);
            animation: modalPop 0.5s ease;
        }

        @keyframes modalPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #c5a059;
            font-size: 3em;
            margin-bottom: 20px;
        }

        .moves {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            color: #c5a059;
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <a href="/games"
        style="position: fixed; left: 20px; top: 20px; color: #c5a059; text-decoration: none; font-size: 1.5em; z-index: 1000;">←
        Geri</a>
    <div class="game-header">
        <h1>🧩 Tarihi Puzzle</h1>
        <div class="level-info">
            <span th:text="'Level ' + ${level.id} + ': ' + ${level.title}">Level 1: Antik Mozaik</span>
            <br>
            <span th:text="${level.difficulty}">3x3 Kolay</span>
        </div>
    </div>

    <div class="puzzle-container">
        <div class="moves">Hamle: <span id="moveCount">0</span></div>

        <div class="puzzle-board" id="puzzleBoard"></div>

        <div class="controls">
            <button class="btn" onclick="shufflePuzzle()">🔀 Karıştır</button>
            <button class="btn btn-secondary" onclick="solvePuzzle()">💡 Çöz</button>
            <a th:href="@{/games}" class="btn btn-secondary">← Oyun Alanına Dön</a>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <h2>🎉 Tebrikler!</h2>
            <p style="font-size: 1.5em; margin: 20px 0;">Puzzle'ı tamamladınız!</p>
            <p style="color: #aaa; margin-bottom: 30px;">Hamle sayısı: <span id="finalMoves">0</span></p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <a th:if="${nextLevel != null}" th:href="@{/puzzle(level=${nextLevel})
}" class="btn">Sonraki Level ▶</a>
                <a th:if="${isFinal}" th:href="@{/games}" class="btn">🏆 Oyun Alanına Dön</a>
                <button class="btn btn-secondary" onclick="location.reload()">🔄 Tekrar Oyna</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const gridSize = /*[[${level.gridSize}]]*/ 3;
        const imageUrl = /*[[${level.imageUrl}]]*/ '/img/puzzle1.jpg';
        const pieceSize = 130; // Her parça 130px
        const boardSize = pieceSize * gridSize + (gridSize + 1) * 3; // 3px gap

        let board = [];
        let emptyPos = { row: gridSize - 1, col: gridSize - 1 };
        let moves = 0;

        // Initialize board
        function init() {
            const puzzleBoard = document.getElementById('puzzleBoard');
            puzzleBoard.style.gridTemplateColumns = `repeat(${gridSize}, ${pieceSize}px)`;
            puzzleBoard.style.gridTemplateRows = `repeat(${gridSize}, ${pieceSize}px)`;

            // Create pieces
            for (let row = 0; row < gridSize; row++) {
                board[row] = [];
                for (let col = 0; col < gridSize; col++) {
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece';
                    piece.style.width = pieceSize + 'px';
                    piece.style.height = pieceSize + 'px';

                    if (row === emptyPos.row && col === emptyPos.col) {
                        piece.style.opacity = '0';
                        piece.dataset.empty = 'true';
                    } else {
                        piece.style.backgroundImage = `url('${imageUrl}')`;
                        piece.style.backgroundPosition = `-${col * pieceSize}px -${row * pieceSize}px`;
                        piece.style.backgroundSize = `${gridSize * pieceSize}px ${gridSize * pieceSize}px`;
                    }

                    piece.dataset.row = row;
                    piece.dataset.col = col;
                    piece.onclick = () => movePiece(row, col);

                    board[row][col] = piece;
                    puzzleBoard.appendChild(piece);
                }
            }

            shufflePuzzle();
        }

        function movePiece(row, col) {
            const rowDiff = Math.abs(row - emptyPos.row);
            const colDiff = Math.abs(col - emptyPos.col);

            if ((rowDiff === 1 && colDiff === 0) || (rowDiff === 0 && colDiff === 1)) {
                // Swap piece with empty
                const temp = board[row][col];
                board[row][col] = board[emptyPos.row][emptyPos.col];
                board[emptyPos.row][emptyPos.col] = temp;

                // Update positions
                board[row][col].dataset.row = row;
                board[row][col].dataset.col = col;
                board[emptyPos.row][emptyPos.col].dataset.row = emptyPos.row;
                board[emptyPos.row][emptyPos.col].dataset.col = emptyPos.col;

                // Update empty position
                emptyPos = { row, col };

                moves++;
                document.getElementById('moveCount').textContent = moves;

                renderBoard();

                if (checkWin()) {
                    setTimeout(() => {
                        confetti({
                            particleCount: 100,
                            spread: 70,
                            origin: { y: 0.6 }
                        });
                        document.getElementById('finalMoves').textContent = moves;
                        document.getElementById('successModal').classList.add('show');
                    }, 300);
                }
            }
        }

        function renderBoard() {
            const puzzleBoard = document.getElementById('puzzleBoard');
            puzzleBoard.innerHTML = '';

            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    puzzleBoard.appendChild(board[row][col]);
                }
            }
        }

        function shufflePuzzle() {
            // Don't check for win during shuffle
            let shuffling = true;

            moves = 0;
            document.getElementById('moveCount').textContent = moves;

            // Random shuffle with enough moves to scramble
            const shuffleMoves = gridSize * gridSize * 20;

            for (let i = 0; i < shuffleMoves; i++) {
                const possibleMoves = [];
                if (emptyPos.row > 0) possibleMoves.push({ row: emptyPos.row - 1, col: emptyPos.col });
                if (emptyPos.row < gridSize - 1) possibleMoves.push({ row: emptyPos.row + 1, col: emptyPos.col });
                if (emptyPos.col > 0) possibleMoves.push({ row: emptyPos.row, col: emptyPos.col - 1 });
                if (emptyPos.col < gridSize - 1) possibleMoves.push({ row: emptyPos.row, col: emptyPos.col + 1 });

                const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];

                // Silent swap
                const temp = board[randomMove.row][randomMove.col];
                board[randomMove.row][randomMove.col] = board[emptyPos.row][emptyPos.col];
                board[emptyPos.row][emptyPos.col] = temp;

                // DON'T update dataset during shuffle - that causes the win detection bug
                emptyPos = randomMove;
            }

            // NOW update all dataset values after shuffle is complete
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    board[row][col].dataset.row = row;
                    board[row][col].dataset.col = col;
                }
            }

            moves = 0;
            document.getElementById('moveCount').textContent = moves;
            renderBoard();
        }

        function solvePuzzle() {
            // Reset to solved state
            emptyPos = { row: gridSize - 1, col: gridSize - 1 };
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    board[row][col].dataset.row = row;
                    board[row][col].dataset.col = col;
                }
            }
            renderBoard();
        }

        function checkWin() {
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    if (parseInt(board[row][col].dataset.row) !== row ||
                        parseInt(board[row][col].dataset.col) !== col) {
                        return false;
                    }
                }
            }
            return true;
        }

        // Initialize game
        init();
    </script>
</body>

</html>
