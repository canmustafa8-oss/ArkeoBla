<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ArkeoBla Okuyucu Modu</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .reader-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 50px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #dcd6ce;
        }

        .reader-content p {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #333;
        }

        .source-link {
            font-size: 12px;
            color: #999;
            margin-top: 30px;
            display: block;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>

<body>

    <header>
        <div class="container header-content">
            <div class="brand">🏛️ ARKEOBLA - OKUYUCU</div>
            <a href="/" style="color:var(--primary-gold);">← Geri Dön</a>
        </div>
    </header>

    <div class="reader-container">
        <h1 style="font-family: 'Playfair Display'; margin-bottom: 10px;" th:text="${article.title}">Haber Başlığı</h1>
        <hr style="border: 0; border-top: 2px solid #c5a059; margin-bottom: 30px;">

        <div class="reader-content" th:utext="${article.body}">
            İçerik yükleniyor...
        </div>

        <a th:href="${article.source}" target="_blank" class="source-link">
            Bu içerik arama sonuçlarından otomatik derlenmiştir. Orijinal kaynağı görüntülemek için tıklayın.
        </a>
    </div>

</body>

</html>
